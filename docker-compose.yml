services:
  app:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        NEXT_PUBLIC_AFFILIATE_BIRTH_ANNOUNCEMENTS_URL: ${NEXT_PUBLIC_AFFILIATE_BIRTH_ANNOUNCEMENTS_URL:-}
        NEXT_PUBLIC_AFFILIATE_JEWELRY_URL: ${NEXT_PUBLIC_AFFILIATE_JEWELRY_URL:-}
        NEXT_PUBLIC_AFFILIATE_BODYSUITS_URL: ${NEXT_PUBLIC_AFFILIATE_BODYSUITS_URL:-}
        NEXT_PUBLIC_AFFILIATE_MUGS_URL: ${NEXT_PUBLIC_AFFILIATE_MUGS_URL:-}
        NEXT_PUBLIC_AFFILIATE_POSTERS_URL: ${NEXT_PUBLIC_AFFILIATE_POSTERS_URL:-}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://namechooser:${SERVICE_PASSWORD_POSTGRES}@db:5432/namechooser}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      NEXT_PUBLIC_AFFILIATE_BIRTH_ANNOUNCEMENTS_URL: ${NEXT_PUBLIC_AFFILIATE_BIRTH_ANNOUNCEMENTS_URL:-}
      NEXT_PUBLIC_AFFILIATE_JEWELRY_URL: ${NEXT_PUBLIC_AFFILIATE_JEWELRY_URL:-}
      NEXT_PUBLIC_AFFILIATE_BODYSUITS_URL: ${NEXT_PUBLIC_AFFILIATE_BODYSUITS_URL:-}
      NEXT_PUBLIC_AFFILIATE_MUGS_URL: ${NEXT_PUBLIC_AFFILIATE_MUGS_URL:-}
      NEXT_PUBLIC_AFFILIATE_POSTERS_URL: ${NEXT_PUBLIC_AFFILIATE_POSTERS_URL:-}
      ADS_ENABLED: ${ADS_ENABLED:-true}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-ca-pub-6104925526195992}
      ADSENSE_SLOT_BETWEEN_ROUNDS: ${ADSENSE_SLOT_BETWEEN_ROUNDS:-}
      ADSENSE_SLOT_BEFORE_RESULT: ${ADSENSE_SLOT_BEFORE_RESULT:-}
      ADSENSE_SLOT_NAME_PAGE: ${ADSENSE_SLOT_NAME_PAGE:-}
      # Coolify generates the public URL and routes it to this internal port.
      SERVICE_URL_APP_3000: /
      SERVICE_FQDN_APP_3000: /
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: namechooser
      POSTGRES_USER: namechooser
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namechooser -d namechooser"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
